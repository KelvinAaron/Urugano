<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Custom Web Page{% endblock %}</title>
    <link rel="stylesheet" href="/assets/urugano/css/style.css">
</head>
<body>

     <header class="bg-white shadow fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">Urugano Realty</h1>
            <nav class="space-x-4">
                <a href="/listings" class="text-gray-700 hover:text-blue-600">Listings</a>
                <a href="#roommates" class="text-gray-700 hover:text-blue-600">Roommates</a>
                <a href="#student-housing" class="text-gray-700 hover:text-blue-600">Student Housing</a>
                <a href="#login" class="text-gray-700 hover:text-blue-600">Login</a>
            </nav>
        </div>
    </header>

    <!-- Spacer for fixed header -->
    <div class="h-20"></div>

    <main class="container max-w-7xl mt-4 mx-auto px-4 py-4">
        {% block page_content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
        &copy; 2025 Urugano Realty. All rights reserved. | <a href="#" class="text-blue-600">Privacy Policy</a>
        </div>
    </footer>

</body>
</html>
