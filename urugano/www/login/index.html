{# urugano/www/property/index.html #}

{% extends "urugano/templates/pages/web.html" %}

{% block page_content %}
    <section class="flex justify-center items-center">
        <div class="flex flex-col gap-4 bg-white p-4 rounded-lg min-w-[400px] min-h-[400px]">
            <h1 class="text-2xl font-semibold mb-4 self-center">Login</h1>
            <form id="loginForm" class="flex flex-col gap-4">
                <input id="username" name="email" type="text" placeholder="Username" class="border rounded px-4 py-2 active:ring-2 active:ring-blue-600">
                <input id="password" name="password" type="password" placeholder="Password" class="border rounded px-4 py-2 active:ring-2 active:ring-blue-600">
                <button type="submit" id="search-button" class="btn">Login</button>
            </form>
        </div>
    </section>
{% endblock %}

{% block js_content %}   
<script>
    // const baseURL = "https://your-frappe-instance.com";

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const usr = document.getElementById("username").value;
    const pwd = document.getElementById("password").value;

    try {
        const response = await fetch(`/api/method/login`, {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams({ usr, pwd }),
        credentials: "include" 
        });

        if (!response.ok) throw new Error("Invalid credentials");

        const data = await response.json();
        // console.log("Logged in:", data);
        alert(`Welcome, ${data.full_name}`);

        // You can now call authenticated routes like get_logged_user
        fetch(`${baseURL}/api/method/urugano.api.get_logged_user`)
        .then(response => response.json())
        .then(data => {
            console.log("Logged in:", data);
        })
        .catch(error => {
            console.error("Error:", error);
        });

        window.location.href = "/app";

    } catch (err) {
        console.error(err);
        alert("Login failed");
    }
    });
</script>
{% endblock %}
