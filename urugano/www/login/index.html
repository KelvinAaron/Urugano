{# urugano/www/property/index.html #}

{% extends "urugano/templates/pages/web.html" %}

{% block page_content %}
    <section class="flex justify-center items-center">
        <div class="flex flex-col gap-4 bg-white p-4 rounded-lg min-w-[400px] min-h-[400px]">
            <h1 class="text-2xl font-semibold mb-4 self-center">Login</h1>
            <form id="loginForm" class="flex flex-col gap-4">
                <input id="username" name="email" type="text" placeholder="Username" class="border rounded px-4 py-2 active:ring-2 active:ring-blue-600">
                <input id="password" name="password" type="password" placeholder="Password" class="border rounded px-4 py-2 active:ring-2 active:ring-blue-600">
                <button type="submit" id="login-button" class="btn">Login</button>
            </form>
        </div>
    </section>
{% endblock %}

{% block js_content %}   
<script>
    // const baseURL = "https://your-frappe-instance.com";

    document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const usr_name = document.getElementById("username").value;
    const pwd_value = document.getElementById("password").value;
    const btn = document.getElementById("login-button");

    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
        const response = await fetch(`/api/method/login`, {
        method: "POST",
        headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
        usr: usr_name,
        pwd: pwd_value
        })
        });

        if (!response.ok) throw new Error("Invalid credentials");

        const data = await response.json();
        console.log("Logged in:", data);

        user_roles = await fetch("/api/method/urugano.api.user_roles");
        roles = await user_roles.json();
        if (roles.message === true){
            window.location.href = "/app";
        }else{
            window.location.href = "/"
        }

    } catch (err) {
        console.error(err);
        alert("Login failed");
        
    } finally {
        btn.disabled = false;
        btn.textContent = "Login";
    }
    });
</script>
{% endblock %}
