{% extends "urugano/templates/pages/web.html" %}
{% block title %}Sign In — Urugano Realty{% endblock %}

{% block page_content %}
<section class="flex items-center justify-center py-16 px-4">
    <div class="w-full max-w-md">

        <!-- Logo accent -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-1 mb-6">
                <span class="text-2xl font-bold text-brand">Urugano</span>
                <span class="text-2xl font-light text-gray-400">Realty</span>
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Welcome back</h1>
            <p class="text-sm text-muted mt-1">Sign in to your account</p>
        </div>

        <div class="card card-body p-8">
            <form id="loginForm" class="flex flex-col gap-5">
                <div class="form-group">
                    <label for="username" class="label">Email address</label>
                    <input id="username" name="email" type="text" placeholder="you@example.com" class="input">
                </div>
                <div class="form-group">
                    <label for="password" class="label">Password</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" class="input">
                </div>
                <button type="submit" id="login-button" class="btn w-full mt-1">Sign In</button>
            </form>
        </div>

        <p class="text-center text-sm text-muted mt-6">
            Don't have an account?
            <a href="/signup" class="text-brand font-medium hover:underline">Register</a>
        </p>

    </div>
</section>
{% endblock %}

{% block js_content %}
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const usr_name = document.getElementById("username").value;
        const pwd_value = document.getElementById("password").value;
        const btn = document.getElementById("login-button");

        btn.disabled = true;
        btn.textContent = "Signing in…";

        try {
            const response = await fetch(`/api/method/login`, {
                method: "POST",
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ usr: usr_name, pwd: pwd_value })
            });

            if (!response.ok) throw new Error("Invalid credentials");

            const data = await response.json();
            console.log("Logged in:", data);

            const { message: isLandlord } = await frappe.call({ method: 'urugano.api.auth.user_roles' });
            window.location.href = isLandlord ? "/app" : "/";

        } catch (err) {
            console.error(err);
            alert("Login failed. Please check your credentials.");
        } finally {
            btn.disabled = false;
            btn.textContent = "Sign In";
        }
    });
</script>
{% endblock %}
