{# urugano/www/property/index.html #}

{% extends "urugano/templates/pages/web.html" %}
<title>{% block title %}Apply{% endblock %}</title>

{% block page_content %}
<div id="roommate-form-card" class="max-w-2xl mx-auto p-6 bg-white border border-gray-300 rounded-lg">
  <h2 class="text-2xl font-bold mb-4 bg-blue-600 text-white p-2 rounded-md">Roommate Profile</h2>
  <form id="roommate-form">
    <div class="grid grid-cols-1 md:grid-cols-2 md:gap-4">
        <div>
            <div class="mb-4">
              <label class="block mb-1">Name</label>
              <input type="text" name="name" class="w-full p-2 rounded bg-gray-200" />
            </div>
            <div class="mb-4">
            <label class="block mb-1">Gender <span class="text-red-500">*</span></label>
            <select name="gender" required class="w-full p-2 rounded bg-gray-200">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="other">Other</option>
            </select>
            </div>
            <div class="mb-4">
              <label class="block mb-1">Preferred Location</label>
              <input type="text" name="location" class="w-full p-2 rounded bg-gray-200" />
            </div>
            <div class="mb-4">
              <label class="block mb-1">Age</label>
              <input type="number" name="age" class="w-full p-2 rounded bg-gray-200" />
            </div>
            
        </div>
        <div>
            <div class="mb-4">
              <label class="block mb-1">Roommate Gender</label>
              <select name="roommate" class="w-full p-2 rounded bg-gray-200">
                <option value="">Select Preference</option>
                <option value="Same gender">Same Gender</option>
                <option value="Any">Any</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="block mb-1">Minimum Budget</label>
              <input type="number" step="0.01" name="min_budget" class="w-full p-2 rounded bg-gray-200" />
            </div>
            <div class="mb-4">
              <label class="block mb-1">Maximum Budget</label>
              <input type="number" step="0.01" name="max_budget" class="w-full p-2 rounded bg-gray-200" />
            </div>
            <div class="mb-4">
              <label class="block mb-1">Move in Date</label>
              <input type="date" name="move_in_date" class="w-full p-2 rounded bg-gray-200" />
            </div>
        </div>
    </div>

    <div class="mb-4">
      <label class="block mb-1">Additional Notes</label>
      <textarea name="notes" rows="4" class="w-full p-2 rounded bg-gray-200 resize-y"></textarea>
    </div>

    <div class="flex justify-end space-x-2">
      <button type="button" class="px-4 py-2 border rounded text-gray-700 hover:bg-gray-100">Discard</button>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-gray-800">Submit</button>
    </div>
  </form>
</div>

<div id="success-modal" class="hidden max-w-2xl mx-auto py-[80px] absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 border-1 border-gray-300 w-[40%] rounded-lg shadow-2xl bg-white">
    <div class="flex flex-col gap-2 items-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="rgb(37, 99, 235)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-check-big-icon lucide-circle-check-big"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
        <h1 class="text-4xl text-blue-600 font-semibold">Submitted</h1>
        <button id="close-modal" class="bg-gray-400 text-white py-2 px-4 rounded hover:bg-gray-500 mt-4" type="button">
          Submit another application
        </button>
    </div>
</div>

<script defer>
 document.querySelector('form').addEventListener('submit', function(e) {
  // const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
  e.preventDefault(); 
  const form = document.getElementById('roommate-form');
  const formData = new FormData(form);
  const data = Object.fromEntries(formData.entries());

  console.log(data); 

  fetch('/api/method/urugano.api.apply_roommate', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      // 'X-Frappe-CSRF-Token': csrfToken
    },
    body: JSON.stringify(data),
  })
    .then(response => response.json())
    .then(result => {
      console.log(result);
      form.reset();
      document.getElementById('success-modal').classList.remove('hidden');
      document.getElementById('roommate-form-card').classList.add('hidden');
    })
    .catch(error => {
      console.error('Error:', error);
    });
});

document.getElementById('close-modal').addEventListener('click', function(event) {
            event.preventDefault();
            document.getElementById('success-modal').classList.add('hidden');
            document.getElementById('roommate-form-card').classList.remove('hidden');
        });
</script>
{% endblock %}
