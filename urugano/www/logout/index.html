{% extends "urugano/templates/pages/web.html" %}
{% block title %}Signing Out — Urugano Realty{% endblock %}

{% block page_content %}
<section class="flex items-center justify-center py-24 px-4">
    <div class="card card-body p-12 text-center max-w-sm w-full">
        <div class="w-12 h-12 bg-brand-light rounded-pill flex items-center justify-center mx-auto mb-4">
            <i data-lucide="circle-user-round" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800 mb-1">Signing you out…</h1>
        <p class="text-sm text-muted">You'll be redirected to the homepage shortly.</p>
    </div>
</section>
{% endblock %}

{% block js_content %}
<script>
    async function logout_user() {
        try {
            const logout = await fetch(`/api/method/logout`);
            await logout.json();
            window.location.href = "/";
        } catch (err) {
            console.error(err);
            alert("Logout failed");
        }
    }
    logout_user();
</script>
{% endblock %}
