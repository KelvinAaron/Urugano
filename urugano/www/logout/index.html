{% extends "urugano/templates/pages/web.html" %}
{% block title %}Signing Out — Urugano Realty{% endblock %}

{% block page_content %}
<section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-16 bg-surface-alt">
    <div class="card p-14 text-center max-w-sm w-full">
        <div class="w-14 h-14 bg-brand-light rounded-2xl flex items-center justify-center mx-auto mb-5">
            <i data-lucide="log-out" class="w-7 h-7 text-brand"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-1.5" style="font-family: var(--font-display)">Signing you out…</h1>
        <p class="text-sm text-muted">You'll be redirected to the homepage shortly.</p>
        <div class="mt-5 flex justify-center">
            <div class="w-6 h-6 border-2 border-brand border-t-transparent rounded-full" style="animation: spin 0.8s linear infinite;"></div>
        </div>
    </div>
</section>
<style>
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block js_content %}
<script>
    async function logout_user() {
        try {
            await fetch("/api/method/logout");
            window.location.href = "/";
        } catch (err) {
            console.error(err);
            window.location.href = "/";
        }
    }
    logout_user();
</script>
{% endblock %}
