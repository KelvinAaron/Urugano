{# urugano/www/property/index.html #}

{% extends "urugano/templates/pages/web.html" %}

{% block page_content %}
    <section class="flex justify-center items-center">
        <div class="flex flex-col gap-4 bg-white p-4 rounded-lg min-w-[400px] min-h-[400px]">
            <h1 class="text-2xl font-semibold mb-4 self-center">Logout Successful</h1>
            <p class="text-gray-700 self-center">You have been logged out successfully.</p>
        </div>
    </section>
{% endblock %}

{% block js_content %}
<script>
    async function logout_user(){
        try{
            const logout = await fetch(`/api/method/logout`);
            const logout_respones = await logout.json();
            window.location.href = "/"
        }catch (err){
            console.error(err);
            alert("Logout Failed")
        }
    }

    logout_user()

</script>
{% endblock %}
