{# urugano/www/property/index.html #}

{% extends "urugano/templates/pages/web.html" %}

{% block page_content %}

<h1 class="text-3xl font-bold mb-6">Available Properties</h1>

<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    {% for property in properties %}
    <a href="/listings/detail/{{ property.name }}" class="block mb-4 hover:shadow-lg transition-shadow duration-200 hover:cursor-pointer">
        <div class="rounded-lg overflow-hidden shadow p-4 bg-white">
            <div><img src="{{ property.image }}" alt="" class="w-full rounded-2xl h-40 object-cover mb-3"/></div>
            <div>
                <h2 class="text-lg font-semibold mb-1">{{ property.title }}</h2>
                <p class="text-sm text-gray-600 mb-1 font-light">{{ property.location }}</p>
                <p class="text-sm text-gray-600 mb-1 font-bold">RWF {{ property.price }}</p>
            </div>
        </div>
    </a>
    {% endfor %}
</div>

{% endblock %}
