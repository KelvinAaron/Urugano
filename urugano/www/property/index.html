{# urugano/www/property/index.html #}

{% extends "urugano/templates/web.html" %}

{% block page_content %}
<h1 class="text-3xl font-bold mb-6">Available Properties</h1>

<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    {% for item in items %}
    <div class="border rounded-lg overflow-hidden shadow p-4 bg-white">
        <img src="{{ item.img_1 }}" alt="{{ item.title }}" class="w-full h-40 object-cover mb-3">
        <div>
            <h2 class="text-lg font-semibold mb-1"><a href="{{ item.route }}">{{ item.name }}</a></h2>
            <p class="text-sm text-gray-600 mb-1">Price: {{ item.price }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
